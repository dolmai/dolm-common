[tool.poetry]
name = "dolm-common"
version = "1.0.0"
description = ""
authors = ["Roua Ben Ammar <roua.ben-ammar@dolm.ai>"]
license = "Apache-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<4.0.0"
pydantic = ">=2.6.1,<3.0.0"
jsonschema = ">=4.21.1,<5.0.0"
sentencepiece = ">=0.1.99,<0.2.0"
typing-extensions = ">=4.11.0,<5.0.0"

[tool.poetry.group.dev.dependencies]
types-jsonschema = ">=4.21.0.20240118,<5.0.0.0"
types-protobuf = ">=4.24.0.20240129,<5.0.0.0"
mypy-protobuf = ">=3.5.0,<4.0.0"
pytest = ">=7.4.4,<8.0.0"
ruff = ">=0.2.2,<0.3.0"
mypy = ">=1.8.0,<2.0.0"
pytest-cov = ">=4.1.0,<5.0.0"
diff-cover = ">=8.0.3,<9.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
